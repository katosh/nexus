# monitor/bash-footgun-patterns.conf — patterns the PreToolUse Bash
# hook (`monitor/hooks/bash-footgun-guard.sh`) uses to deliver a
# JUST-IN-TIME reminder the moment a worker reaches for a known
# shell footgun. This is the data source that lets the worker floor
# stay slim: instead of front-loading every footgun into every spawn
# prompt (where it dilutes the task, is read once and forgotten, and
# is re-encountered later as a live incident), the relevant reminder
# is injected into context at the exact tool call that would trigger
# it.
#
# Mirrors the proven data-driven shape of async-launch-patterns.conf.
# Each non-blank / non-comment line has FOUR pipe-separated fields:
#
#     tag|severity|command_regex|message
#
#   tag           short stable identifier for this footgun. Used as
#                 the per-window dedup key so a given reminder is
#                 injected at most ONCE per worker session (a worker
#                 who has seen the pkill warning doesn't re-get it on
#                 every later pkill). Rows may SHARE a tag (e.g.
#                 pkill + pgrep) to fire the same reminder once for a
#                 family. Free-form, kebab-case.
#
#   severity      `warn`  — advisory. The hook injects `message` as
#                           PreToolUse `additionalContext` (exit 0):
#                           the tool still runs, the model reads the
#                           reminder in-context and self-corrects on
#                           the next call. Honors the floor's "warn,
#                           don't block" philosophy — bash parsing is
#                           brittle, a hard block false-positives.
#                 `block` — consequence is severe and session-wide.
#                           The hook exits 2, which BLOCKS the tool
#                           and shows `message` to the model, forcing
#                           a redirect. Use sparingly (see the
#                           context-poison guard, a separate hook).
#
#   command_regex Extended regex (POSIX ERE, bash `[[ =~ ]]`) matched
#                 against the FULL `.tool_input.command`. **No literal
#                 `|`** — it is the field separator. Write **`\p`** where
#                 you need a literal pipe; the hook substitutes it AFTER
#                 field splitting (your-org/nexus-code#835), so exclusion
#                 classes can say `[^;&\p]` = "still in the same command".
#                 `\p` does NOT enable alternation across a `|` you did not
#                 intend — it is a plain byte substitution, so a top-level
#                 `a\pb` really does mean the ERE alternation `a|b`; use it
#                 knowingly. For readability, prefer one row per branch
#                 sharing a tag (as the async conf header instructs).
#                 A footgun whose TRIGGER is a literal `|` (a shell pipe,
#                 e.g. `python … | tail`) is still matched in-code by the
#                 hook — see bash-footgun-guard.sh.
#
#   message       The reminder injected into context. Keep it to the
#                 actionable core (what breaks + what to do instead).
#                 No literal `|`. Variable interpolation NOT supported.
#
# Hot path: read once per Bash PreToolUse fire. Keep rows few (<= 20)
# and regexes cheap. Adding a footgun is DATA-ONLY: edit this file,
# commit, redeploy — no code change in the hook.

# ---------------------------------------------------------------------
# SELF-MATCHING PROCESS-TABLE LOOKUPS. One mechanism, two consequences.
#
# A `-f` (full-command-line) match is evaluated against every process's
# argv — including the argv of the shell running the match, which holds
# the pattern as a literal. So the lookup matches ITSELF. A pattern that
# matches its own observer also matches its own waiter, and the two
# consequences are not equally visible:
#
#   KILL  (pkill-self)     — loud. The kill lands on your own process or
#                            a sibling's; someone notices immediately.
#   WAIT  (procmatch-wait) — SILENT. `until ! pgrep …` can never become
#                            true, so the loop runs forever. A hung
#                            waiter still holding a live child can be
#                            classified as healthy-with-a-background-job,
#                            so nothing looks at it.
#
# ORDER IS LOAD-BEARING: the hook takes the FIRST matching row, so the
# wait rows MUST precede the kill rows. A wait-loop also matches the kill
# regex, and delivering the kill message to someone who is not killing
# anything trains them to dismiss the reminder as inapplicable.
#
# The WAIT regexes require a `-f`-family flag for the same reason the message
# gives: the self-match exists only for FULL-ARGV matching. `pgrep -P` (pid
# scoped), `pgrep -x` (comm) and a bare `pgrep name` cannot match the waiter,
# and `pgrep -P` is the form `lint-no-mass-kill.sh` explicitly blesses, with 26
# call sites in this tree. (`-[a-zA-Z-]*f` covers `--full` too — its second
# `-` is inside the class — so no alternation is needed, which matters because
# a literal `|` is this file's FIELD SEPARATOR and silently truncates the row.)
# Matching any `pgrep` here warned about the repo's own
# recommended fix on the semicolon-free multi-line `while read … done < <(pgrep
# -P $$)` — measured, and a guard that flags its own remedy teaches the reader
# to dismiss the tag.
#
# The kill regexes deliberately allow flags BETWEEN the command and `-f`
# (`pkill -u "$USER" -f …`). Anchoring `-f` directly after the command
# name — as they once did — silently missed exactly that form, which is
# the natural way to write a scoped match.
procmatch-wait|warn|\buntil[[:space:]][^;]{0,60}pgrep[^;]{0,40}-[a-zA-Z-]*f|A wait-loop that matches the process table by NAME cannot exit: this shell's own argv contains the pattern as a literal, so pgrep matches the waiter itself and `! pgrep` is never true. It hangs SILENTLY and can be read as healthy-with-a-background-job, so nothing investigates. Capture the PID when you launch the job and wait on THAT — `job & pid=$!; wait "$pid"` (or `while kill -0 "$pid"`). A name identifies a CLASS, a pid identifies the THING. Bracketing (`[j]obname`) is a weaker fallback: it only holds if the bare pattern appears nowhere else in your argv.
procmatch-wait|warn|\bwhile[[:space:]][^;]{0,60}pgrep[^;]{0,40}-[a-zA-Z-]*f|A wait-loop that matches the process table by NAME cannot exit: this shell's own argv contains the pattern as a literal, so pgrep matches the waiter itself and the condition never flips. It hangs SILENTLY and can be read as healthy-with-a-background-job, so nothing investigates. Capture the PID when you launch the job and wait on THAT — `job & pid=$!; wait "$pid"` (or `while kill -0 "$pid"`). A name identifies a CLASS, a pid identifies the THING. Bracketing (`[j]obname`) is a weaker fallback: it only holds if the bare pattern appears nowhere else in your argv.
# ROW ORDER: these MUST precede the pkill-self rows. The hook takes the
# FIRST match, and `kill $(pgrep -u "$USER" -f X)` matches BOTH. Below the
# pkill-self rows this pair is unreachable for any pgrep carrying -f —
# which is the only form its own message is written about — and the reader
# gets "kill by recorded PID" instead of the one message naming
# proc-kill-authorized --filter. Measured: the order below is asserted by
# TAG in test-bash-footgun-guard.sh, so a future insertion cannot re-hide it.
kill-list-denylist|warn|\bkill[[:space:]]+[^;]*\$\([^)]*\bps\b|You are building a kill list from a process listing. A sibling agent's suite is invoked cwd-relative, so its argv is BYTE-IDENTICAL to yours — no name or path filter can separate them, and the default arm kills theirs (your-org/nexus-code#851: two sibling legs died EXIT=143). Pipe the pids through `"$NEXUS_ROOT"/monitor/proc-kill-authorized --filter`, which authorises by SESSION ownership with a default-deny arm and names every refusal.
kill-list-denylist|warn|\bkill[[:space:]]+[^;]*\$\([^)]*pgrep|You are building a kill list from a pgrep. `-f` matching rides argv, and a sibling agent's cwd-relative invocation is byte-identical to yours — nothing in the string distinguishes them (your-org/nexus-code#851). Pipe the pids through `"$NEXUS_ROOT"/monitor/proc-kill-authorized --filter` (session ownership, allowlist, default-deny) before `kill` sees them.

pkill-self|warn|\bpkill[[:space:]]+[^;&]{0,80}-[a-zA-Z-]*f|A `-f` process match rides claude's argv, which holds your FULL prompt — so it matches your OWN process (self-kill, exit 137) and can reap sibling workers sharing the launcher argv. Kill by recorded PID ($!) or a marker guaranteed absent from your prompt, never by a -f pattern.
pkill-self|warn|\bpgrep[[:space:]]+[^;&]{0,80}-[a-zA-Z-]*f|A `-f` process match rides claude's argv, which holds your FULL prompt — pgrep -f matches your OWN process and any sibling worker sharing the launcher argv, so a follow-on kill self-terminates you. Match by recorded PID or a marker guaranteed absent from your prompt. If you are WAITING rather than killing, the same self-match makes the loop unable to exit — wait on a recorded pid instead.

# jobs -p empty in a fresh Bash-tool shell.
jobs-p|warn|kill[[:space:]]+\$\(jobs[[:space:]]+-p|`jobs -p` is EMPTY in each fresh Bash-tool shell, so `kill $(jobs -p)` no-ops and leaks the background process. Save each `$!` to a file/var when you launch it, or spawn-and-kill within a single Bash call.

# Force-push: the BOUNDARY, delivered at the push rather than
# front-loaded into every spawn (your-org/nexus-code#835). The floor
# states the shared-vs-own rule in one sentence; the precondition
# command and the merge-gate rationale live here, where they are
# runnable. MUST precede the generic git-push row — first match wins.
#
# THREE rows, one tag, because the regex field cannot hold a `|`:
#   --force*                  covers --force / --force-with-lease
#   -[a-zA-Z]*f               covers -f AND clustered -uf (order-insensitive;
#                             `-uf` is a real forced update and used to MISS,
#                             because the old `-f` form required `f` to sit
#                             immediately after the dash)
#   [[:space:]]\+             covers the +refspec forms — `git push origin
#                             +dev`, `+HEAD:main`, `+refs/heads/…`. This is the
#                             one that mattered most: `git push origin +dev` IS
#                             the forbidden act and drew no warning at all.
# `[[:space:]]-[-]*f` is deliberately NOT used — it also fires on
# `--follow-tags`; that negative is pinned in the tests.
#
# `\p` in a regex means a literal `|` (the hook substitutes it after field
# splitting), which is what lets the exclusion classes be `[^;&\p]` — i.e.
# "still in the same command". Without it, `git push origin main | xargs -f x`
# matched on XARGS' `-f`. (The regression test must use a second command with no
# letter `p` in it — unsubstituted, `[^;&\p]` excludes the LETTER p, so a `grep`
# there blocks the match on its own `p` and the assertion becomes VACUOUS.)
#
# The MESSAGE field is last, so `read` leaves its embedded pipes
# intact — verified, which is why the precondition can be a pipeline.
force-push|warn|git[[:space:]][^;&\p]*push[^;&\p]*--force|Force-push boundary: NEVER force-push a SHARED branch (`dev`, `main`, or any branch someone else has pushed commits to) — that destroys history irrecoverably. Force-pushing your OWN PR branch after rebasing it onto the current base is EXPECTED. CHECK IT, DO NOT ASSUME IT: run `bash "$NEXUS_ROOT"/monitor/force-push-check.sh <your git push args>` — pass the SAME arguments you are about to give `git push` (or none, for a bare push). It runs `git push --dry-run --porcelain --force` and reads back which refs would move on which remote, so the answer comes from GIT'S OWN resolution rather than a model of it, then FAILS CLOSED: 0=safe, 1=UNSAFE and it lists the commits you would destroy, 2=REFUSED (could not determine — NOT a clearance), 3=the refs would be created new. Do NOT hand-roll it as `git fetch`+`git log`: that has FOUR measured false-clearance modes — an AUTHOR check cannot see a sibling (every agent commits with the OPERATOR's identity), an empty result conflates "nothing to destroy" with "I could not look", comparing HEAD is wrong whenever the branch pushed is not the one checked out, and assuming `origin` is wrong under `remote.pushDefault`/`branch.<n>.pushRemote`. `--force-with-lease` does NOT backstop any of it — its lease is satisfied by the very fetch a rebase requires; pin it as `--force-with-lease=<branch>:<sha-you-saw-before-fetching>`.
force-push|warn|git[[:space:]][^;&\p]*push[^;&\p]*[[:space:]]-[a-zA-Z]*f|Force-push boundary: NEVER force-push a SHARED branch (`dev`, `main`, or any branch someone else has pushed commits to) — that destroys history irrecoverably. Force-pushing your OWN PR branch after rebasing it onto the current base is EXPECTED. CHECK IT, DO NOT ASSUME IT: run `bash "$NEXUS_ROOT"/monitor/force-push-check.sh <your git push args>` — pass the SAME arguments you are about to give `git push` (or none, for a bare push). It runs `git push --dry-run --porcelain --force` and reads back which refs would move on which remote, so the answer comes from GIT'S OWN resolution rather than a model of it, then FAILS CLOSED: 0=safe, 1=UNSAFE and it lists the commits you would destroy, 2=REFUSED (could not determine — NOT a clearance), 3=the refs would be created new. Do NOT hand-roll it as `git fetch`+`git log`: that has FOUR measured false-clearance modes — an AUTHOR check cannot see a sibling (every agent commits with the OPERATOR's identity), an empty result conflates "nothing to destroy" with "I could not look", comparing HEAD is wrong whenever the branch pushed is not the one checked out, and assuming `origin` is wrong under `remote.pushDefault`/`branch.<n>.pushRemote`. `--force-with-lease` does NOT backstop any of it — its lease is satisfied by the very fetch a rebase requires; pin it as `--force-with-lease=<branch>:<sha-you-saw-before-fetching>`.
force-push|warn|git[[:space:]][^;&\p]*push[^;&\p]*[[:space:]]\+|Force-push boundary: NEVER force-push a SHARED branch (`dev`, `main`, or any branch someone else has pushed commits to) — that destroys history irrecoverably. Force-pushing your OWN PR branch after rebasing it onto the current base is EXPECTED. CHECK IT, DO NOT ASSUME IT: run `bash "$NEXUS_ROOT"/monitor/force-push-check.sh <your git push args>` — pass the SAME arguments you are about to give `git push` (or none, for a bare push). It runs `git push --dry-run --porcelain --force` and reads back which refs would move on which remote, so the answer comes from GIT'S OWN resolution rather than a model of it, then FAILS CLOSED: 0=safe, 1=UNSAFE and it lists the commits you would destroy, 2=REFUSED (could not determine — NOT a clearance), 3=the refs would be created new. Do NOT hand-roll it as `git fetch`+`git log`: that has FOUR measured false-clearance modes — an AUTHOR check cannot see a sibling (every agent commits with the OPERATOR's identity), an empty result conflates "nothing to destroy" with "I could not look", comparing HEAD is wrong whenever the branch pushed is not the one checked out, and assuming `origin` is wrong under `remote.pushDefault`/`branch.<n>.pushRemote`. `--force-with-lease` does NOT backstop any of it — its lease is satisfied by the very fetch a rebase requires; pin it as `--force-with-lease=<branch>:<sha-you-saw-before-fetching>`.

# git push: cwd-leak across &&-chains + no --no-verify.
git-push|warn|git[[:space:]]+push|Pin each push to its clone: the Bash shell's cwd persists across calls and a `cd` earlier in an &&-chain leaks forward, so a second push in one batch can silently target the first push's remote. Use `git -C <clone> push …` for EACH push. No --no-verify — fix the root cause, and see the force-push boundary rule if you are rebasing.

# scancel by name/partition reaps sibling workers' identically-named
# jobs. Two rows, one tag.
scancel-name|warn|scancel\b[^0-9]*--name|scancel by EXPLICIT job-id, never --name/--partition: those filters match sibling nexus workers' identically-named jobs under the same $USER. Cancel the specific id: `scancel <jobid>`.
scancel-name|warn|scancel\b[^0-9]*--partition|scancel by EXPLICIT job-id, never --partition/--name: those filters match sibling nexus workers' jobs in this project. Cancel the specific id: `scancel <jobid>`.

# Foreground sleep is blocked in the sandbox.
foreground-sleep|warn|^[[:space:]]*sleep[[:space:]]+[0-9]|Foreground `sleep` is blocked in the sandbox. To wait on async work use a `Monitor` until-loop (`until [ -f <sentinel> ]; do sleep 30; done`) — `sleep` INSIDE the loop is fine.
# Kill list built from a process listing (your-org/nexus-code#851). A
# sibling agent's cwd-relative invocation is byte-identical to yours, so
# there is nothing in `args` to filter on and any name/path predicate has a
# permissive default arm. Two rows, one tag: the regex field cannot contain
# a literal `|`, so the `ps … | grep -v … | kill` pipeline is matched by its
# ends rather than as a whole.
