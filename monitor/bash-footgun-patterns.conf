# monitor/bash-footgun-patterns.conf — patterns the PreToolUse Bash
# hook (`monitor/hooks/bash-footgun-guard.sh`) uses to deliver a
# JUST-IN-TIME reminder the moment a worker reaches for a known
# shell footgun. This is the data source that lets the worker floor
# stay slim: instead of front-loading every footgun into every spawn
# prompt (where it dilutes the task, is read once and forgotten, and
# is re-encountered later as a live incident), the relevant reminder
# is injected into context at the exact tool call that would trigger
# it.
#
# Mirrors the proven data-driven shape of async-launch-patterns.conf.
# Each non-blank / non-comment line has FOUR pipe-separated fields:
#
#     tag|severity|command_regex|message
#
#   tag           short stable identifier for this footgun. Used as
#                 the per-window dedup key so a given reminder is
#                 injected at most ONCE per worker session (a worker
#                 who has seen the pkill warning doesn't re-get it on
#                 every later pkill). Rows may SHARE a tag (e.g.
#                 pkill + pgrep) to fire the same reminder once for a
#                 family. Free-form, kebab-case.
#
#   severity      `warn`  — advisory. The hook injects `message` as
#                           PreToolUse `additionalContext` (exit 0):
#                           the tool still runs, the model reads the
#                           reminder in-context and self-corrects on
#                           the next call. Honors the floor's "warn,
#                           don't block" philosophy — bash parsing is
#                           brittle, a hard block false-positives.
#                 `block` — consequence is severe and session-wide.
#                           The hook exits 2, which BLOCKS the tool
#                           and shows `message` to the model, forcing
#                           a redirect. Use sparingly (see the
#                           context-poison guard, a separate hook).
#
#   command_regex Extended regex (POSIX ERE, bash `[[ =~ ]]`) matched
#                 against the FULL `.tool_input.command`. **No literal
#                 `|`** — it is the field separator. Write **`\p`** where
#                 you need a literal pipe; the hook substitutes it AFTER
#                 field splitting (your-org/nexus-code#835), so exclusion
#                 classes can say `[^;&\p]` = "still in the same command".
#                 `\p` does NOT enable alternation across a `|` you did not
#                 intend — it is a plain byte substitution, so a top-level
#                 `a\pb` really does mean the ERE alternation `a|b`; use it
#                 knowingly. For readability, prefer one row per branch
#                 sharing a tag (as the async conf header instructs).
#                 A footgun whose TRIGGER is a literal `|` (a shell pipe,
#                 e.g. `python … | tail`) is still matched in-code by the
#                 hook — see bash-footgun-guard.sh.
#
#   message       The reminder injected into context. Keep it to the
#                 actionable core (what breaks + what to do instead).
#                 No literal `|`. Variable interpolation NOT supported.
#
# Hot path: read once per Bash PreToolUse fire. Keep rows few (<= 20)
# and regexes cheap. Adding a footgun is DATA-ONLY: edit this file,
# commit, redeploy — no code change in the hook.

# ---------------------------------------------------------------------
# TMUX SERVER LETHALITY — FIRST IN THIS FILE, DELIBERATELY.
#
# ROW ORDER IS THE PLACEMENT DECISION, not an accident of editing. The hook
# takes the FIRST matching row, so a rule's position IS its priority. These
# rows lead because this is the only footgun in this file whose consequence is
# UNRECOVERABLE FROM INSIDE THE SANDBOX: `bwrap` is PID 1 running tmux under
# `--die-with-parent`, so when the server goes, nothing in here can bring it
# back. Everything below is survivable. Placement is asserted BY TAG in
# test-bash-footgun-guard.sh so a future insertion cannot quietly demote it.
#
# WHAT HAPPENED. On 2026-08-09 this board's tmux server died and took the
# watcher, all 17 worker windows, the services window, and the operator's own
# session with it. The operator restarted by hand; five days of board state
# were lost.
#
# WHAT IS *NOT* KNOWN, and must not be implied. THE 08-09 CAUSE WAS NEVER
# ATTRIBUTED. The watcher died mid-write, its log ends cleanly at 19:58:11
# with no cause recorded, and no worker transcript contains a kill verb. These
# rows therefore guard a CLASS — they are not a replay of a known command, and
# any message here that implied otherwise would be inventing evidence.
#
# The classification mirrors monitor/cc-harness/_tmux_kill_scan.awk, which
# lints the same class in the CORPUS. That lint reads FILES; nothing read the
# LIVE command a worker was about to run, which is the gap these rows close.
# Rule numbering is kept aligned with that scanner so the two can be diffed:
#   rule1  kill-server with no -L/-S on the same command
#   rule3  kill-session/kill-window/kill-pane with no -t
# (the scanner's rule2/rule4 — TMUX_TMPDIR-only, and pinning the DEFAULT
# socket — are corpus-shaped and not reproduced here; see the issue.)
#
# FOUR VERBS, FOUR TAGS (your-org/nexus-code#951 skeptic F2). The hook dedups per
# (window, tag), so a single shared tag would spend the whole family's one
# warning on whichever verb fired first: a worker warned about `kill-server` at
# hour 1 would receive NOTHING when it later ran `kill-window` in the same
# window. The force-push rows in this file set the precedent deliberately — two
# tags so a normal push earlier in the session cannot consume the force-push
# boundary later — and the argument is stronger here, since this is the only
# family whose consequence is unrecoverable. Tag granularity is a different axis
# from the rule-numbering alignment with `_tmux_kill_scan.awk`, which is
# unaffected.
#
# THE EXCLUSION CLASSES ARE THE WHOLE DESIGN. `[^;&\p]` means "still in the
# same command" (`\p` is this file's literal-pipe escape). The kill-server row
# additionally refuses `-L`/`-S` ANYWHERE in the command, because the socket
# pin PRECEDES the verb (`tmux -L priv kill-server`); the untargeted rows
# refuse `-t` only AFTER the verb, which is where a target is written. Get this
# backwards and the guard fires on the correct, pinned form — and a guard that
# flags the safe idiom on a 19-window board is suppressed by the first person
# under time pressure, which removes the only protection against an
# unrecoverable event. Seven legitimate forms are pinned as controls in the
# tests for exactly that reason.
tmux-kill-server|warn|\btmux([^-;&\p]\p-[^LS;&\p])*kill-server([^-;&\p]\p-[^LS;&\p])*([;&]\p$)|`tmux kill-server` with no `-L`/`-S` ON THE SAME COMMAND targets the DEFAULT server — the operator's. On 2026-08-09 this board's server died and took the watcher, all 17 worker windows, the services window and the operator's own session; `bwrap` is PID 1 running tmux under `--die-with-parent`, so there is NO in-sandbox recovery. THE 08-09 CAUSE WAS NEVER ATTRIBUTED (no transcript holds a kill verb, the watcher log ends clean) — this guards the CLASS, it is not a replay. Pin a private socket: `env -u TMUX tmux -L <priv> kill-server`. `TMUX_TMPDIR` alone is NOT containment — precedence is `-L`/`-S` over `$TMUX` over `TMUX_TMPDIR`, and `$TMUX` is always set for you.
tmux-kill-window|warn|\btmux[^;&\p]*kill-window([^-;&\p]\p-[^t;&\p])*([;&]\p$)|An untargeted `tmux kill-window` acts on the CURRENT window, and killing the last window of the last session ENDS THE SERVER — which on 2026-08-09 took the watcher, all 17 worker windows, the services window and the operator's session with it, unrecoverably (`bwrap` is PID 1, `--die-with-parent`). THE 08-09 CAUSE WAS NEVER ATTRIBUTED; this guards the class, not a known command. Always name the target: `tmux kill-window -t <session>:<index>`. If this is a TEST server, pin a private socket as well — `env -u TMUX tmux -L <priv> …` — since `TMUX_TMPDIR` alone is not containment.
tmux-kill-session|warn|\btmux[^;&\p]*kill-session([^-;&\p]\p-[^t;&\p])*([;&]\p$)|An untargeted `tmux kill-session` acts on the CURRENT session, and killing the last session ENDS THE SERVER — which on 2026-08-09 took the watcher, all 17 worker windows, the services window and the operator's session with it, unrecoverably (`bwrap` is PID 1, `--die-with-parent`). THE 08-09 CAUSE WAS NEVER ATTRIBUTED; this guards the class, not a known command. Always name the target: `tmux kill-session -t <session>`. If this is a TEST server, pin a private socket as well — `env -u TMUX tmux -L <priv> …` — since `TMUX_TMPDIR` alone is not containment.
tmux-kill-pane|warn|\btmux[^;&\p]*kill-pane([^-;&\p]\p-[^t;&\p])*([;&]\p$)|An untargeted `tmux kill-pane` acts on the CURRENT pane, and killing the last pane of the last window of the last session ENDS THE SERVER — which on 2026-08-09 took the watcher, all 17 worker windows, the services window and the operator's session with it, unrecoverably (`bwrap` is PID 1, `--die-with-parent`). THE 08-09 CAUSE WAS NEVER ATTRIBUTED; this guards the class, not a known command. Always name the target: `tmux kill-pane -t <session>:<window>.<pane>`. If this is a TEST server, pin a private socket as well — `env -u TMUX tmux -L <priv> …`.

# ---------------------------------------------------------------------
# SELF-MATCHING PROCESS-TABLE LOOKUPS. One mechanism, two consequences.
#
# A `-f` (full-command-line) match is evaluated against every process's
# argv — including the argv of the shell running the match, which holds
# the pattern as a literal. So the lookup matches ITSELF. A pattern that
# matches its own observer also matches its own waiter, and the two
# consequences are not equally visible:
#
#   KILL  (pkill-self)     — loud. The kill lands on your own process or
#                            a sibling's; someone notices immediately.
#   WAIT  (procmatch-wait) — SILENT. `until ! pgrep …` can never become
#                            true, so the loop runs forever. A hung
#                            waiter still holding a live child can be
#                            classified as healthy-with-a-background-job,
#                            so nothing looks at it.
#
# ORDER IS STILL LOAD-BEARING, but it now decides WHICH MESSAGE LEADS rather
# than which one exists (your-org/nexus-code#1057). Under first-match-wins a
# wait-loop — which also matches the kill regex — got the kill message and
# nothing else, and delivering the kill message to someone who is not killing
# anything trains them to dismiss the reminder as inapplicable. Every matching
# row is now delivered, in file order, so the wait rows preceding the kill rows
# means the reader sees the HANG first. That is the claim the tests pin.
#
# BOTH FAMILIES NOW NAME THE SIBLING POPULATION, not just the self-match
# (your-org/nexus-code#1073). The pre-#1073 framing here was self-only — "this
# shell's own argv" — which made bracketing look sufficient and made "a marker
# guaranteed absent from YOUR prompt" look like a fix. Neither holds: every
# SIBLING agent's argv carries ITS prompt, prompts quote the watched string
# verbatim, and that population grows with every worker spawned. Measured
# 2026-08-27, a correctly bracketed pattern matched three live sibling `claude`
# processes. The rows therefore hand over to `monitor/proc-exists-authorized`
# for the WAIT case and `monitor/proc-kill-authorized --filter` for the KILL
# case, which are separate tools because they gate separate things.
#
# The WAIT regexes require a `-f`-family flag for the same reason the message
# gives: the self-match exists only for FULL-ARGV matching. `pgrep -P` (pid
# scoped), `pgrep -x` (comm) and a bare `pgrep name` cannot match the waiter,
# and `pgrep -P` is the form `lint-no-mass-kill.sh` explicitly blesses, with 26
# call sites in this tree. (`-[a-zA-Z-]*f` covers `--full` too — its second
# `-` is inside the class — so no alternation is needed, which matters because
# a literal `|` is this file's FIELD SEPARATOR and silently truncates the row.)
# Matching any `pgrep` here warned about the repo's own
# recommended fix on the semicolon-free multi-line `while read … done < <(pgrep
# -P $$)` — measured, and a guard that flags its own remedy teaches the reader
# to dismiss the tag.
#
# The kill regexes deliberately allow flags BETWEEN the command and `-f`
# (`pkill -u "$USER" -f …`). Anchoring `-f` directly after the command
# name — as they once did — silently missed exactly that form, which is
# the natural way to write a scoped match.
procmatch-wait|warn|\buntil[[:space:]][^;]{0,60}pgrep[^;]{0,40}-[a-zA-Z-]*f|A wait-loop that matches the process table by NAME cannot exit, and there are TWO reasons — the second is the one no spelling fixes. (1) This shell's own argv holds the pattern, so pgrep matches the waiter itself; bracketing (`[j]obname`) closes THIS ONE AND ONLY THIS ONE. (2) Every SIBLING agent's `claude` argv holds its ENTIRE PROMPT, and prompts quote the watched string verbatim, so a pattern chosen to be absent from YOUR prompt can still sit in theirs — a population that GROWS WITH EVERY WORKER SPAWNED and that no string excludes. Measured on this board 2026-08-27: a CORRECTLY BRACKETED pattern still matched three live sibling `claude` processes (your-org/nexus-code#1073). It hangs SILENTLY and can be read as healthy-with-a-background-job, so nothing investigates — a loop of this shape held a window for 5h20m. WAIT ON A HANDLE, not a name: `"$NEXUS_ROOT"/monitor/proc-exists-authorized` ` --until-gone --pid <recorded-pid>` or ` --until-gone --token <async-run-token>`. It OWNS THE LOOP so the polarity cannot be written wrong, and it REFUSES rather than guessing (rc 3 = could not determine, which is neither present nor absent). By hand, the same idea is `job & pid=$!; wait "$pid"`. A name identifies a CLASS, a pid identifies the THING.
procmatch-wait|warn|\bwhile[[:space:]][^;]{0,60}pgrep[^;]{0,40}-[a-zA-Z-]*f|A wait-loop that matches the process table by NAME cannot exit, and there are TWO reasons — the second is the one no spelling fixes. (1) This shell's own argv holds the pattern, so pgrep matches the waiter itself and the condition never flips; bracketing (`[j]obname`) closes THIS ONE AND ONLY THIS ONE. (2) Every SIBLING agent's `claude` argv holds its ENTIRE PROMPT, and prompts quote the watched string verbatim, so a pattern chosen to be absent from YOUR prompt can still sit in theirs — a population that GROWS WITH EVERY WORKER SPAWNED and that no string excludes. Measured on this board 2026-08-27: a CORRECTLY BRACKETED pattern still matched three live sibling `claude` processes (your-org/nexus-code#1073). It hangs SILENTLY and can be read as healthy-with-a-background-job, so nothing investigates — a loop of this shape held a window for 5h20m. WAIT ON A HANDLE, not a name: `"$NEXUS_ROOT"/monitor/proc-exists-authorized` ` --until-gone --pid <recorded-pid>` or ` --until-gone --token <async-run-token>`. It OWNS THE LOOP so the polarity cannot be written wrong, and it REFUSES rather than guessing (rc 3 = could not determine, which is neither present nor absent). By hand, the same idea is `job & pid=$!; wait "$pid"`. A name identifies a CLASS, a pid identifies the THING.
# ROW ORDER: these MUST precede the pkill-self rows. The hook takes the
# FIRST match, and `kill $(pgrep -u "$USER" -f X)` matches BOTH. Below the
# pkill-self rows this pair is unreachable for any pgrep carrying -f —
# which is the only form its own message is written about — and the reader
# gets "kill by recorded PID" instead of the one message naming
# proc-kill-authorized --filter. Measured: the order below is asserted by
# TAG in test-bash-footgun-guard.sh, so a future insertion cannot re-hide it.
kill-list-denylist|warn|\bkill[[:space:]]+[^;]*\$\([^)]*\bps\b|You are building a kill list from a process listing. A sibling agent's suite is invoked cwd-relative, so its argv is BYTE-IDENTICAL to yours — no name or path filter can separate them, and the default arm kills theirs (your-org/nexus-code#851: two sibling legs died EXIT=143). Pipe the pids through `"$NEXUS_ROOT"/monitor/proc-kill-authorized --filter`, which authorises by SESSION ownership with a default-deny arm and names every refusal.
kill-list-denylist|warn|\bkill[[:space:]]+[^;]*\$\([^)]*pgrep|You are building a kill list from a pgrep. `-f` matching rides argv, and a sibling agent's cwd-relative invocation is byte-identical to yours — nothing in the string distinguishes them (your-org/nexus-code#851). Pipe the pids through `"$NEXUS_ROOT"/monitor/proc-kill-authorized --filter` (session ownership, allowlist, default-deny) before `kill` sees them.

pkill-self|warn|\bpkill[[:space:]]+[^;&]{0,80}-[a-zA-Z-]*f|A `-f` process match rides claude's argv, which holds your FULL prompt — so it matches your OWN process (self-kill, exit 137). AND IT DOES NOT STOP AT YOU. Every SIBLING agent's `claude` argv holds its ENTIRE PROMPT, and prompts quote the watched string verbatim, so a pattern chosen to be absent from YOUR prompt can still sit in theirs — a population that GROWS WITH EVERY WORKER SPAWNED and that no string excludes. Measured on this board 2026-08-27: a CORRECTLY BRACKETED pattern still matched three live sibling `claude` processes (your-org/nexus-code#1073). So `a marker guaranteed absent from your prompt` is NOT sufficient — it was the old advice here and it only ever addressed the self-match. Kill by recorded PID (`$!`), or pipe candidates through `"$NEXUS_ROOT"/monitor/proc-kill-authorized --filter`, which authorises by SESSION ownership with a default-deny arm. If you are WAITING rather than killing, that filter does not apply — it gates KILLS, not control flow — and `"$NEXUS_ROOT"/monitor/proc-exists-authorized` is the one that does.
pkill-self|warn|\bpgrep[[:space:]]+[^;&]{0,80}-[a-zA-Z-]*f|A `-f` process match rides claude's argv, which holds your FULL prompt — pgrep -f matches your OWN process, so a follow-on kill self-terminates you. AND IT DOES NOT STOP AT YOU. Every SIBLING agent's `claude` argv holds its ENTIRE PROMPT, and prompts quote the watched string verbatim, so a pattern chosen to be absent from YOUR prompt can still sit in theirs — a population that GROWS WITH EVERY WORKER SPAWNED and that no string excludes. Measured on this board 2026-08-27: a CORRECTLY BRACKETED pattern still matched three live sibling `claude` processes (your-org/nexus-code#1073). Match by recorded PID, or authorise candidates with `"$NEXUS_ROOT"/monitor/proc-kill-authorized --filter` before `kill` sees them. If you are WAITING rather than killing, the same self-match makes the loop unable to exit and the sibling match makes it unable to exit for ANY spelling — ask by handle instead: `"$NEXUS_ROOT"/monitor/proc-exists-authorized`, which owns the loop and refuses (rc 3) rather than guessing.

# jobs -p empty in a fresh Bash-tool shell.
jobs-p|warn|kill[[:space:]]+\$\(jobs[[:space:]]+-p|`jobs -p` is EMPTY in each fresh Bash-tool shell, so `kill $(jobs -p)` no-ops and leaks the background process. Save each `$!` to a file/var when you launch it, or spawn-and-kill within a single Bash call.

# Force-push: the BOUNDARY, delivered at the push rather than
# front-loaded into every spawn (your-org/nexus-code#835). The floor
# states the shared-vs-own rule in one sentence; the precondition
# command and the merge-gate rationale live here, where they are
# runnable. MUST precede the generic git-push row — first match wins.
#
# THREE rows, one tag, because the regex field cannot hold a `|`:
#   --force*                  covers --force / --force-with-lease
#   -[a-zA-Z]*f               covers -f AND clustered -uf (order-insensitive;
#                             `-uf` is a real forced update and used to MISS,
#                             because the old `-f` form required `f` to sit
#                             immediately after the dash)
#   [[:space:]]\+             covers the +refspec forms — `git push origin
#                             +dev`, `+HEAD:main`, `+refs/heads/…`. This is the
#                             one that mattered most: `git push origin +dev` IS
#                             the forbidden act and drew no warning at all.
# `[[:space:]]-[-]*f` is deliberately NOT used — it also fires on
# `--follow-tags`; that negative is pinned in the tests.
#
# `\p` in a regex means a literal `|` (the hook substitutes it after field
# splitting), which is what lets the exclusion classes be `[^;&\p]` — i.e.
# "still in the same command". Without it, `git push origin main | xargs -f x`
# matched on XARGS' `-f`. (The regression test must use a second command with no
# letter `p` in it — unsubstituted, `[^;&\p]` excludes the LETTER p, so a `grep`
# there blocks the match on its own `p` and the assertion becomes VACUOUS.)
#
# The MESSAGE field is last, so `read` leaves its embedded pipes
# intact — verified, which is why the precondition can be a pipeline.
force-push|warn|git[[:space:]][^;&\p]*push[^;&\p]*--force|Force-push boundary: NEVER force-push a SHARED branch (`dev`, `main`, or any branch someone else has pushed commits to) — that destroys history irrecoverably. Force-pushing your OWN PR branch after rebasing it onto the current base is EXPECTED. CHECK IT, DO NOT ASSUME IT: run `bash "$NEXUS_ROOT"/monitor/force-push-check.sh <your git push args>` — pass the SAME arguments you are about to give `git push` (or none, for a bare push). It runs `git push --dry-run --porcelain --force` and reads back which refs would move on which remote, so the answer comes from GIT'S OWN resolution rather than a model of it, then FAILS CLOSED: 0=safe, 1=UNSAFE and it lists the commits it could not find in your tip, 2=REFUSED (could not determine — NOT a clearance), 3=the refs would be created new. READ rc 1 AS A CLAIM TO RECONCILE, NOT A VERDICT TO OBEY (your-org/nexus-code#835, #898): the tool matches commits by PATCH-ID, so three ROUTINE operations that destroy NOTHING are reported UNSAFE with the byte-identical text a real loss produces — a rebase whose replay needed CONFLICT RESOLUTION (the resolved hunk's context differs; a CHANGELOG.md rebase is this, every time), a CONTENT-CHANGING `--amend` (a message-only amend is cleared), and a rebase that FLATTENS A MERGE (merge and empty commits have no patch-id and are always counted destroyed). The escape is PER-FILE PATCH-ID RECONCILIATION: for each listed sha, `git show --stat <sha>` names its files; for each file compare `git diff <sha>^ <sha> -- <file>` with `git diff <remote>/<branch>...HEAD -- <file>` (or by eye for a conflict-resolved hunk) and confirm the change is PRESENT in your tip. Every listed commit accounted for = the over-report, push. ANY listed commit whose change is NOT in your tip = a real loss — stop, `git fetch`, and put it back. It is deliberately NOT weakened: a false UNSAFE costs you one reconciliation, a false SAFE costs a sibling their commit. AND ONE rc 2 IS PERMANENT: `REFUSED: this push has N destinations (a multi-URL remote)` never clears on retry (your-org/nexus-code#930) — one verdict cannot describe several remotes. Next step is per URL: `git remote get-url --push --all <remote>` lists them; run `git push --dry-run --porcelain --force <url> <refspec>` for EACH and read every `To` block yourself, or push to one URL at a time. Do NOT hand-roll it as `git fetch`+`git log`: that has FOUR measured false-clearance modes — an AUTHOR check cannot see a sibling (every agent commits with the OPERATOR's identity), an empty result conflates "nothing to destroy" with "I could not look", comparing HEAD is wrong whenever the branch pushed is not the one checked out, and assuming `origin` is wrong under `remote.pushDefault`/`branch.<n>.pushRemote`. `--force-with-lease` does NOT backstop any of it — its lease is satisfied by the very fetch a rebase requires; pin it as `--force-with-lease=<branch>:<sha-you-saw-before-fetching>`.
force-push|warn|git[[:space:]][^;&\p]*push[^;&\p]*[[:space:]]-[a-zA-Z]*f|Force-push boundary: NEVER force-push a SHARED branch (`dev`, `main`, or any branch someone else has pushed commits to) — that destroys history irrecoverably. Force-pushing your OWN PR branch after rebasing it onto the current base is EXPECTED. CHECK IT, DO NOT ASSUME IT: run `bash "$NEXUS_ROOT"/monitor/force-push-check.sh <your git push args>` — pass the SAME arguments you are about to give `git push` (or none, for a bare push). It runs `git push --dry-run --porcelain --force` and reads back which refs would move on which remote, so the answer comes from GIT'S OWN resolution rather than a model of it, then FAILS CLOSED: 0=safe, 1=UNSAFE and it lists the commits it could not find in your tip, 2=REFUSED (could not determine — NOT a clearance), 3=the refs would be created new. READ rc 1 AS A CLAIM TO RECONCILE, NOT A VERDICT TO OBEY (your-org/nexus-code#835, #898): the tool matches commits by PATCH-ID, so three ROUTINE operations that destroy NOTHING are reported UNSAFE with the byte-identical text a real loss produces — a rebase whose replay needed CONFLICT RESOLUTION (the resolved hunk's context differs; a CHANGELOG.md rebase is this, every time), a CONTENT-CHANGING `--amend` (a message-only amend is cleared), and a rebase that FLATTENS A MERGE (merge and empty commits have no patch-id and are always counted destroyed). The escape is PER-FILE PATCH-ID RECONCILIATION: for each listed sha, `git show --stat <sha>` names its files; for each file compare `git diff <sha>^ <sha> -- <file>` with `git diff <remote>/<branch>...HEAD -- <file>` (or by eye for a conflict-resolved hunk) and confirm the change is PRESENT in your tip. Every listed commit accounted for = the over-report, push. ANY listed commit whose change is NOT in your tip = a real loss — stop, `git fetch`, and put it back. It is deliberately NOT weakened: a false UNSAFE costs you one reconciliation, a false SAFE costs a sibling their commit. AND ONE rc 2 IS PERMANENT: `REFUSED: this push has N destinations (a multi-URL remote)` never clears on retry (your-org/nexus-code#930) — one verdict cannot describe several remotes. Next step is per URL: `git remote get-url --push --all <remote>` lists them; run `git push --dry-run --porcelain --force <url> <refspec>` for EACH and read every `To` block yourself, or push to one URL at a time. Do NOT hand-roll it as `git fetch`+`git log`: that has FOUR measured false-clearance modes — an AUTHOR check cannot see a sibling (every agent commits with the OPERATOR's identity), an empty result conflates "nothing to destroy" with "I could not look", comparing HEAD is wrong whenever the branch pushed is not the one checked out, and assuming `origin` is wrong under `remote.pushDefault`/`branch.<n>.pushRemote`. `--force-with-lease` does NOT backstop any of it — its lease is satisfied by the very fetch a rebase requires; pin it as `--force-with-lease=<branch>:<sha-you-saw-before-fetching>`.
force-push|warn|git[[:space:]][^;&\p]*push[^;&\p]*[[:space:]]\+|Force-push boundary: NEVER force-push a SHARED branch (`dev`, `main`, or any branch someone else has pushed commits to) — that destroys history irrecoverably. Force-pushing your OWN PR branch after rebasing it onto the current base is EXPECTED. CHECK IT, DO NOT ASSUME IT: run `bash "$NEXUS_ROOT"/monitor/force-push-check.sh <your git push args>` — pass the SAME arguments you are about to give `git push` (or none, for a bare push). It runs `git push --dry-run --porcelain --force` and reads back which refs would move on which remote, so the answer comes from GIT'S OWN resolution rather than a model of it, then FAILS CLOSED: 0=safe, 1=UNSAFE and it lists the commits it could not find in your tip, 2=REFUSED (could not determine — NOT a clearance), 3=the refs would be created new. READ rc 1 AS A CLAIM TO RECONCILE, NOT A VERDICT TO OBEY (your-org/nexus-code#835, #898): the tool matches commits by PATCH-ID, so three ROUTINE operations that destroy NOTHING are reported UNSAFE with the byte-identical text a real loss produces — a rebase whose replay needed CONFLICT RESOLUTION (the resolved hunk's context differs; a CHANGELOG.md rebase is this, every time), a CONTENT-CHANGING `--amend` (a message-only amend is cleared), and a rebase that FLATTENS A MERGE (merge and empty commits have no patch-id and are always counted destroyed). The escape is PER-FILE PATCH-ID RECONCILIATION: for each listed sha, `git show --stat <sha>` names its files; for each file compare `git diff <sha>^ <sha> -- <file>` with `git diff <remote>/<branch>...HEAD -- <file>` (or by eye for a conflict-resolved hunk) and confirm the change is PRESENT in your tip. Every listed commit accounted for = the over-report, push. ANY listed commit whose change is NOT in your tip = a real loss — stop, `git fetch`, and put it back. It is deliberately NOT weakened: a false UNSAFE costs you one reconciliation, a false SAFE costs a sibling their commit. AND ONE rc 2 IS PERMANENT: `REFUSED: this push has N destinations (a multi-URL remote)` never clears on retry (your-org/nexus-code#930) — one verdict cannot describe several remotes. Next step is per URL: `git remote get-url --push --all <remote>` lists them; run `git push --dry-run --porcelain --force <url> <refspec>` for EACH and read every `To` block yourself, or push to one URL at a time. Do NOT hand-roll it as `git fetch`+`git log`: that has FOUR measured false-clearance modes — an AUTHOR check cannot see a sibling (every agent commits with the OPERATOR's identity), an empty result conflates "nothing to destroy" with "I could not look", comparing HEAD is wrong whenever the branch pushed is not the one checked out, and assuming `origin` is wrong under `remote.pushDefault`/`branch.<n>.pushRemote`. `--force-with-lease` does NOT backstop any of it — its lease is satisfied by the very fetch a rebase requires; pin it as `--force-with-lease=<branch>:<sha-you-saw-before-fetching>`.

# git push: cwd-leak across &&-chains + no --no-verify.
git-push|warn|git[[:space:]]+push|Pin each push to its clone: the Bash shell's cwd persists across calls and a `cd` earlier in an &&-chain leaks forward, so a second push in one batch can silently target the first push's remote. Use `git -C <clone> push …` for EACH push. No --no-verify — fix the root cause, and see the force-push boundary rule if you are rebasing.

# scancel by name/partition reaps sibling workers' identically-named
# jobs. Two rows, one tag.
scancel-name|warn|scancel\b[^0-9]*--name|scancel by EXPLICIT job-id, never --name/--partition: those filters match sibling nexus workers' identically-named jobs under the same $USER. Cancel the specific id: `scancel <jobid>`.
scancel-name|warn|scancel\b[^0-9]*--partition|scancel by EXPLICIT job-id, never --partition/--name: those filters match sibling nexus workers' jobs in this project. Cancel the specific id: `scancel <jobid>`.

# Foreground sleep is blocked in the sandbox. This row HANDS OUT the wait
# shape, so it must also name the way that shape wedges: the loop it sends you
# to write is the one that can never exit if its condition is a process NAME
# (your-org/nexus-code#927 — a 5h20m wedge burning 191 CPU-seconds). Advice
# that names the tool but not the trap is how the guard feeds its own footgun.
#
# AND THE EXEMPLAR IS THE PART PEOPLE COPY (your-org/nexus-code#1236). This row
# used to LEAD with `until [ -f <sentinel> ]; do sleep 30; done` — no deadline,
# no status consulted — while the rest of the same message argued at length for
# both and pointed at `proc-exists-authorized`, which owns the loop precisely so
# the polarity cannot be inverted. The conclusion was right and its opening
# example did not have the properties the conclusion demanded: a reader who
# copies the first code block gets the shape, and only a reader who finishes the
# paragraph gets the fix. Six workers held windows on stale background shells in
# one session.
#
# The lead is now the shape the conclusion prescribes, and the bare until-loop is
# demoted to a named counterexample with its witness attached — a 28-hour
# production wait on a status file that, on the `died` classification its job had
# been given, nothing was going to write. A `died` job is exactly the case a
# file-existence predicate cannot express, which is why the counterexample
# belongs in the row rather than only in the issue.
#
# This comment used to gloss `died` as "been killed before it could write that
# file". That is the overclaim your-org/nexus-code#1237 F1/F9 is about — `died`
# classifies the RECORDED pid, not the work — and it sat directly above the row
# whose message was corrected, which is the vocabulary-teaching position that
# made site 2 of that fix matter in the first place.
foreground-sleep|warn|^[[:space:]]*sleep[[:space:]]+[0-9]|Foreground `sleep` is blocked in the sandbox. HAND THE WHOLE WAIT TO A TOOL THAT OWNS THE LOOP AND CARRIES A DEADLINE: launch with `monitor/async-run.sh --desc "<what>" -- <cmd>` (it RETAINS the rc), wait with `"$NEXUS_ROOT"/monitor/proc-exists-authorized --until-gone --token <t> --timeout 1800`, then READ the status with `monitor/async-run.sh --status-line <t>`. RUN THE WAITING STEP IN A `Monitor` OR A BACKGROUNDED BASH CALL, never in a foreground one: a 1800s budget outlives any foreground tool call, and `sleep` INSIDE the tool's own loop is fine. That shape has the two properties a hand-rolled loop almost never has: a DEADLINE (`--timeout`, default 900; `0` is unbounded and must be asked for explicitly) and a RETAINED EXIT STATUS to consult once the wait ends. Read the rc — 0 met, 1 absent, 2 usage, 3 REFUSED (could not determine, NOT absent), 4 TIMEOUT. A BARE `until [ -f <sentinel> ]; do sleep 30; done` WAS PRINTED HERE AS THE ANSWER AND IS NOT ONE: no deadline, no status consulted, and its sentinel can be a file that will NEVER APPEAR. Measured in production — a 28-HOUR wait running `until [ -s "$T/status" ]; do sleep 60; done` against an async-run status file for a job whose verdict was `died` — that verdict meaning the RECORDED pid is gone with no status written, so on that classification nothing will ever write the file the loop sleeps on — still looping at 1.46s of CPU across 28h, with `pane-state` reporting the window ACTIVE throughout (your-org/nexus-code#1236, #1235). `died` is a value no file-existence predicate can express. AND NEVER WAIT ON A PROCESS NAME: `until ! pgrep -f <name>` can never become true — this shell's own argv contains the pattern, and bracketing closes only that half. Every SIBLING agent's `claude` argv holds its ENTIRE PROMPT, and prompts quote the watched string verbatim, so a pattern chosen to be absent from YOUR prompt can still sit in theirs — a population that GROWS WITH EVERY WORKER SPAWNED and that no string excludes. Measured 2026-08-27: a CORRECTLY BRACKETED pattern still matched three live sibling `claude` processes (your-org/nexus-code#1073). If you must wait on something you launched yourself, record the pid (`job & pid=$!`) and pass `--pid <n>` — never the name.

# THE WAIT SHAPE THE ROW ABOVE CONDEMNS BUT COULD NOT SEE (your-org/nexus-code#1250).
#
# `foreground-sleep`'s message names `until [ -f <sentinel> ]; do sleep 30; done` as
# "PRINTED HERE AS THE ANSWER AND IS NOT ONE" — and then cannot match it, because its
# matcher is gated on `^[[:space:]]*sleep`, a foreground `sleep` at LINE START. In
# `do sleep 30; done` the `sleep` is not at line start. So the corrected guidance
# reached an agent writing a bare `sleep` and NEVER reached the agent writing the loop
# it is actually about: a matcher that cannot see the construct its message describes.
#
# ARM ORDER, checked rather than assumed (your-org/nexus-code#1121). Placed here, one
# row below `foreground-sleep`, because the two are DISJOINT — `^[[:space:]]*sleep`
# cannot match `do sleep`, so neither shadows the other in either arrangement. It sits
# BELOW `procmatch-wait` (which requires `pgrep`) for the same reason plus specificity:
# a name-based wait is the more specific diagnosis and must keep first claim on it.
# Both disjointness claims are asserted by tag in test-bash-footgun-guard.sh.
#
# The bracket test is spelled `-[fserdxwn]` rather than just `-f`, so `-s` (the measured
# 28-hour instance), `-e`, `-d` and the negated `[ ! -f X ]` spelling all land in the
# same arm rather than one spelling escaping the row written for its family.
unbounded-sentinel-wait|warn|\b(until\pwhile)[[:space:]]+[^;]{0,80}\[[[:space:]]*(![[:space:]]*)?-[fserdxwn][^]]{0,60}\][^;]{0,20};[[:space:]]*do[^;]{0,60}\bsleep\b|An UNBOUNDED SENTINEL WAIT. `until [ -f X ]; do sleep N; done` has neither of the two properties a wait needs: NO DEADLINE, and NO STATUS CONSULTED when it ends. Its sentinel can be a file that will NEVER APPEAR — `monitor/async-run.sh` defines `died` as the recorded pid gone AND NO STATUS FILE WRITTEN, so on exactly that verdict nothing will ever create the file you are sleeping on. Measured in production: 28 HOURS looping on `until [ -s "$T/status" ]; do sleep 60; done`, 1.46s of CPU across the whole run, with `pane-state` reporting the window ACTIVE throughout (your-org/nexus-code#1236, #1235). IT ALSO FAILS IN BOTH DIRECTIONS: `while [ ! -f X ]` waits forever, and the `until` spelling EXITS IMMEDIATELY if the sentinel already exists from a previous run, so you proceed as though the job finished — the manufactured-success direction, where every artefact says the work was done and the only evidence is an absence. HAND THE WAIT TO A TOOL THAT OWNS THE LOOP: `"$NEXUS_ROOT"/monitor/proc-exists-authorized --until-gone --token <t> --timeout 1800`, then read the verdict with `monitor/async-run.sh --status <t>` — which RESOLVES `died`, a value no file-existence predicate can express. Read the rc: 0 present, 1 absent, 2 usage, 3 REFUSED (could not determine — NOT absent), 4 TIMEOUT. If you never recorded a handle, relaunch through `monitor/async-run.sh --desc "<what>" -- <cmd>`.

# A COMMAND-PREDICATE UNBOUNDED WAIT (your-org/nexus-code#1447). The row above
# keys on a BRACKET file-test; `procmatch-wait` keys on `pgrep`. A wait whose
# predicate is an ordinary COMMAND — `until grep -q PAT FILE; do sleep 30; done`,
# `until s=$(sacct …); [[ $s =~ … ]]; do sleep 120; done` — matched NEITHER, and it
# is STRICTLY WORSE than the bracket form: a file-existence wait terminates when
# the job writes the file; a wait for a STRING INSIDE the file fails even when
# the job succeeds perfectly, because the string may be one the producer never
# writes. Measured: 5h36m on `until grep -q '^terminal' "$S"` against an
# async-run status file whose only lines are `rc=` and `ended=` — `terminal` is
# the REPORTING VERB's output vocabulary, never the file's.
#
# POPULATION, NOT PREDICATE. Four agents hit four spellings in one night and no
# arm fired on any of them; an arm per predicate would still be waiting for the
# fifth. So this arm keys on the LOOP SHAPE — `until|while … ; do sleep N; done`,
# a body that is ONLY a sleep — and the guard's in-code disarm exempts just the
# two forms the repo blesses (`kill -0 <pid>` and `proc-exists-authorized`) plus
# the two shapes that already have a more specific row (bracket test, pgrep), so
# the bracket/pgrep worker is not told the same thing twice. Everything else
# WARNS: the default is the deny direction (your-org/nexus-code#1121).
#
# `\p` is `|`. `.{0,300}` rather than `[^;]` because the predicate itself may
# carry `;` (the `sacct` instance does: `until s=$(…); [[ … ]]; do`).
unbounded-command-wait|warn|\b(until\pwhile)[[:space:]]+.{0,300}[;[:space:]]do[[:space:]]+sleep[[:space:]]+[0-9]+[[:space:]]*[;[:space:]][[:space:]]*done\b|AN UNBOUNDED WAIT ON A COMMAND PREDICATE — no deadline, and a break condition that may NEVER become true. Two ways it fails, both measured on this board in ONE night: (1) THE TOKEN IS NOT IN THE FILE'S VOCABULARY. `until grep -q '^terminal' "$S"` waited 5h36m on an async-run status file whose ONLY lines are `rc=` and `ended=`; `terminal` is what `async-run.sh --status` PRINTS, never what the file CONTAINS. Grep the producer's write site before you poll for a word — and for async-run, do not poll the file at all: `monitor/async-run.sh --await --token <t> --timeout <s>` is the typed, bounded form and `--status <t>` resolves `died`, a value no file can express. (2) `grep -q` IS EXISTENTIAL. A wait for N jobs needs a UNIVERSAL: `until sacct -j A,B … \| grep -qE 'COMPLETED\|FAILED'` is true the moment the FIRST job finishes (measured: both arms announced terminal 17 minutes early, and every downstream artefact said the work was done). Build the universal from a COUNT — `until [ "$(sacct -j A,B -P -n -o State \| grep -cE 'COMPLETED\|FAILED\|CANCELLED\|TIMEOUT')" -eq 2 ]` — and note `all()` over an EMPTY set is vacuously true, so assert the count is non-zero too. A parked `PENDING (Dependency)` job is in NO terminal state; give every such loop a deadline. Prefer a tool that OWNS the loop: `"$NEXUS_ROOT"/monitor/proc-exists-authorized --until-gone --token <t> --timeout 1800` (rc 0 gone, 3 REFUSED, 4 TIMEOUT), run in a Monitor or a BACKGROUNDED Bash call. Both hung waiters read `working-background` for hours — a pane at near-zero CPU is BLOCKED, not long-running. (grepq-antipattern: the piped `| grep -q` forms above are quoted to WARN against them.)

# AN EXISTENCE QUERY PIPED INTO `head` (your-org/nexus-code#1446). `grep -r … \|
# head -5` reads as "stop after 5 hits" and behaves as "scan everything" the
# moment the hits run out: `head` exits at N, the producer learns of it only via
# SIGPIPE ON ITS NEXT WRITE, and with no further matches it walks the whole tree
# in silence and is never signalled. So the hang is SPECIFIC to the answer the
# author was hunting — the terminating case is "yes, at least N times", the
# non-terminating case is "no". Three workers wedged >5h in one session on this
# shape, every pane reading `working-background`; one of them searched
# `reports/`, which is gitignored, so it would have returned a SILENT ZERO had it
# finished (your-org/nexus-code#618). `-m1` bounds matches per FILE, not overall.
# `([^\p;]\p\\\\p)*` is `([^|;]|\\\|)*` after substitution: a grep run that may
# carry a BRE `\|` alternation inside its pattern (the 2h48m instance did).
existence-query-head|warn|\b((command[[:space:]]+)?(grep\pegrep\pfgrep\prg\pug)[[:space:]]+([^\p;]\p\\\\p)*(-[A-Za-z]*[rR][A-Za-z]*\p--recursive\p--dereference-recursive)([^\p;]\p\\\\p)*\pfind[[:space:]]+[^\p;]*)\\p[[:space:]]*head\b|AN EXISTENCE QUERY PIPED INTO `head` DOES NOT STOP WHEN THE ANSWER IS "NO". `head -N` exits at N hits; the producer only learns via SIGPIPE on its NEXT write, so with no further matches it walks the ENTIRE tree in silence and is never signalled. The hang is specific to the case you care about — "does this identifier appear anywhere" terminates on YES and runs to exhaustion on NO. Measured: three workers wedged 49m, 1h54m and 2h48m in one session, each pane reading `working-background` throughout, indistinguishable from progress. `-m1` bounds matches PER FILE, not overall. BOUND THE WALK, NOT THE OUTPUT: `find DIR -maxdepth N -type f -print0 \| xargs -0 grep -l PATTERN`, or name the directories you actually mean. NEVER recurse into `reports/` — it is gitignored and the `ugrep --ignore-files` wrapper matches NOTHING there at rc 0 (a confident, wrong "no"): use `monitor/ng report-grep PATTERN`, which exits 3 rather than hand you a zero it cannot vouch for. Anything that may run long goes through `monitor/async-run.sh --desc "<what>" -- <cmd>` so it keeps its exit status and does not pin your pane. A child at ~0% CPU for an hour is BLOCKED on the filesystem, not computing.

# A launcher that discards the exit status (your-org/nexus-code#1071). The
# rule is NOT "don't use nohup" — it is "don't use a launcher that discards the
# exit status", which is why the message hands over a replacement rather than a
# prohibition. Six workers in one session held waits they could not resolve; four
# of the six had used a bare `nohup`, and for those four the question "did my
# producer succeed?" had no answer even in principle.
#
# `warn`, NOT `block`, and the reason is worth stating so nobody "upgrades" it
# thinking it makes the control terminal. `deliver` calls `mark_seen` BEFORE
# exiting 2, so a block is a ONE-SHOT refusal: the identical command re-run
# immediately afterwards sails through. Calling that terminal would be exactly
# the overclaim `#1071` is about. A bare `nohup` is also legitimately correct
# sometimes (a nudge whose status nobody will ever want), and blocking a correct
# command is a worse failure than warning about a risky one. THE TERMINAL HALF OF
# `#1071` IS THE WATCHER WAKE LOOP (`monitor/watcher/_orphan_async.sh`), which
# needs nothing from the worker at all. This row's job is narrower and real: hand
# the worker the status-preserving launcher at the one moment it is useful.
#
# POSITION, NOT MENTION (your-org/nexus-code#948), and it was needed HERE: the
# first draft of this row was `\bnohup\b[^;&]*&([^&]\p$)` and it FIRED on
#     echo "we used to nohup things &"
# — measured, not hypothesised. This conf's rows are matched against COMMAND
# TEXT, and prose about a launch is command text; the population most likely to
# type such a line is the agent working on this very rule. So the row requires a
# SYNTACTIC POSITION only a launch can occupy: start of the command, or
# immediately after a `;` `&` `(` separator.
#
# The `&([^&]\p$)` tail excludes `nohup foo && bar` — a FOREGROUND nohup, where
# the `&` belongs to the operator, not to a background launch.
#
# RESIDUAL, declared rather than chased: `echo 'a; nohup x &'` still matches,
# because it is TEXTUALLY IDENTICAL to a real `a; nohup x &`. No command-text
# regex can separate them — the same undecidable case async-launch-patterns.conf
# declares in its own header.
async-status|warn|(^\p[;&(])[[:space:]]*nohup\b[^;&]*&([^&]\p$)|A bare `nohup ... &` DESTROYS THE EXIT STATUS, and that is the defect — not the backgrounding. MEASURED ON THIS HOST, not assumed: the child SURVIVES the Bash tool call (reparented to init, ppid 1); what dies is the parent shell that would have reaped it. So nothing anywhere records how the job ended, and "finished cleanly" and "SIGKILLed at 28 GB RSS" both read as simply ABSENT. AN ABSENT PROCESS IS NOT A COMPLETED JOB: a producer killed mid-write leaves a TRUNCATED, PLAUSIBLE intermediate, not an empty one, so it passes every emptiness check and silently shortens every number you derive from it. Use `monitor/async-run.sh --desc "<what>" -- <cmd> ...` instead: it setsid-detaches the same way, RETAINS the rc, registers a resolvable `asyncrun:<token>` wait, and `--status <token>` answers running / terminal rc=N / died-before-it-could-report. Six workers in one session (your-org/nexus-code#1071) could not tell those three apart. AND YOU STILL OWN THE WAKE, UNDER A DEADLINE: wait with `"$NEXUS_ROOT"/monitor/proc-exists-authorized --until-gone --token <t> --timeout 1800`, then read the verdict with `monitor/async-run.sh --status <t>`. DO NOT POLL THE STATUS FILE FOR EXISTENCE. `died` is defined as the recorded pid gone AND NO STATUS FILE WRITTEN, so on exactly that verdict the file you are waiting on will NEVER APPEAR and an existence-poll cannot terminate — measured at 28 HOURS in production (your-org/nexus-code#1236, #1235). `--status` resolves `died`; a file test cannot express it. Run the waiting step in a `Monitor` or a BACKGROUNDED Bash call, never a foreground one. The watcher will resolve the wait and paste the verdict if you idle, but that is a BACKSTOP, not your resume mechanism.
# Kill list built from a process listing (your-org/nexus-code#851). A
# sibling agent's cwd-relative invocation is byte-identical to yours, so
# there is nothing in `args` to filter on and any name/path predicate has a
# permissive default arm. Two rows, one tag: the regex field cannot contain
# a literal `|`, so the `ps … | grep -v … | kill` pipeline is matched by its
# ends rather than as a whole.

# ── THE ZSH-IS-NOT-BASH FAMILY (your-org/nexus-code#1159) ──────────────────────
#
# LAST IN THE FILE, DELIBERATELY, AND THAT IS THE ARM-ORDER DECISION (#1121).
# These two rows are the most GENERAL matchers here — an unquoted `$VAR` appears in
# a large fraction of all commands — and the hook takes the FIRST matching row. Put
# them earlier and they would shadow every specific diagnosis below them: a
# `git push $BRANCH` would surface a word-splitting note instead of the force-push
# boundary, and `until [ -f $F ]; do sleep 30; done` would lose the sentinel-wait
# message. Specific first, general last. Asserted by tag in
# test-bash-footgun-guard.sh so an insertion cannot promote them.
#
# WHY THIS IS A HEURISTIC AND WHY THAT IS ACCEPTABLE HERE. Whether a string holds
# more than one field is a RUNTIME property; no source-text matcher can decide it,
# so this necessarily over-fires on a single-valued `$VAR`. The cost is bounded by
# construction: the hook dedups per (window, tag), so an over-eager arm costs a
# worker exactly ONE message per session. Weighed against the measured cost of the
# miss — a four-cell matrix misdiagnosed as an environment fault — one message is
# the cheaper error. Stated because "key on the property, not the shape" is the
# rule in this repo, and this row cannot: the property is undecidable statically.
#
# KNOWN OVER-FIRE, recorded rather than discovered later: `$VAR` preceded by a space
# INSIDE an already-open quote (`"a $VAR b"`) matches, because ERE has no lookbehind
# and the guard does not parse quote state. Bounded by the same dedup.
# Command-less redirection: `> file` with no command word (your-org/nexus-code#1393).
# Inert in bash; in zsh it RUNS $NULLCMD (cat) on the tool call's inherited stdin and
# blocks forever at 0% CPU. Anchored at a command boundary (start, `;`, `(`, `{`,
# `\p`, `& `, or a control char = newline) and REQUIRING the target to END the
# command, so `echo x > f`, `cmd 2> err`, `cmd &> all` and a heredoc blockquote
# line with more than one word do not fire. Verified against 7 positive and 9
# negative samples by test-claude-md-nullcmd-redirect.sh.
nullcmd-redirect|warn|(^\p;\p\(\p\{\p\\p\p&[[:space:]]\p[[:cntrl:]])[[:space:]]*>>?[[:space:]]*[^[:space:]>&;\p]+[[:space:]]*($\p;\p&&\p\\p\p&\p[[:cntrl:]])|IN ZSH A BARE `> file` IS NOT A TRUNCATE, IT IS A COMMAND: zsh runs $NULLCMD (`cat`) under the redirection, and on an agent's Bash tool call that `cat` reads INHERITED stdin, which never closes. The call then BLOCKS FOREVER at 0% CPU with no error, no output and no timeout — a job of exactly this shape sat 7h30m; the /proc signature is a child `cat` with NO ARGUMENTS in wchan unix_stream_read_generic under a parent in sigsuspend (your-org/nexus-code#1393). `< /dev/null` MASKS it, which is why every script and every `bash -c` test of the idiom works and the defect waits for the one call that omits it. Write `: > file` — `:` is the command, `>` its redirection, correct in both shells. And read a job at 0% CPU for hours as BLOCKED, not long-running: check its wchan, fd/0 and cmdline in /proc before waiting on it.

zsh-word-split|warn|[[:space:]]\$[A-Z][A-Z0-9_]{2,}([[:space:]]\p$)|ZSH DOES NOT WORD-SPLIT UNQUOTED PARAMETERS, and your Bash tool runs zsh. `cmd $VAR` passes the WHOLE STRING AS ONE ARGUMENT where bash would pass several. Measured: `A="t.py::one t.py::two"; prog $A` gives argc=1 under zsh and argc=2 under bash; fed to pytest that is rc=4. Fix: `${=VAR}` to force splitting, or use an ARRAY (`a=(one two); prog "${a[@]}"`) — an array is the better answer because it also survives elements containing spaces. THE FAMILY HAS BOTH POLARITIES, which is why recognising it is hard: the ARGUMENT form `cmd $VAR` fails LOUDLY (rc=4, usage error), while the LOOP form `for x in $VAR` fails SILENTLY at rc=0 — a 4-cell matrix runs ONE cell and reports success. THE DIAGNOSTIC SIGNATURE FOR THE LOUD HALF: because only the argument expansion is broken, EVERY CELL OF A MATRIX FAILS IDENTICALLY. That reads as a bad venv, a bad interpreter or a bad host — each plausible, each the wrong place to look. A uniform failure across every cell is EVIDENCE FOR this bug, not against it (your-org/nexus-code#1159). AND IT IS DISCONTINUOUS IN THE INPUT: at ONE element the argument form behaves correctly, so a harness smoke-tested with a single element passes and breaks only when extended to two — the cheap check is the one that cannot find it.
