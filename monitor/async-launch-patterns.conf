# monitor/async-launch-patterns.conf — patterns the PostToolUse
# Bash hook (`monitor/hooks/async-launch-detect.sh`) uses to detect
# launches of async external work in a worker's `Bash` tool calls.
#
# Each non-blank / non-comment line has FOUR pipe-separated fields:
#
#     kind|command_regex|id_regex|desc
#
#   kind          short identifier of the launch class. Free-form;
#                 the watcher's classifier only counts entries, so
#                 you can add new kinds without touching code.
#                 Examples: `slurm`, `slurm-srun-async`, `nohup`.
#
#   command_regex Extended regex matched (via bash `[[ =~ ]]`)
#                 against the FULL `tool_input.command` string the
#                 worker passed to Bash. Bash regex is POSIX ERE
#                 + `\b` word-boundary. Anchor with `^[[:space:]]*`
#                 or `\b` as appropriate.
#
#                 **No literal `|` in the regex** — the `|` is the
#                 field separator, and a row carrying one is SHREDDED
#                 by the split: cmd_re becomes a fragment, the row
#                 matches nothing, and a detector row is disabled with
#                 no error. The parse assertion in
#                 test-async-launch-detect.sh enforces this.
#
#                 **Write `\x7c` where you mean `|`** — the hook
#                 decodes it to a literal `|` AFTER the field split
#                 (your-org/nexus-code#1269). POSIX ERE has no `\x`
#                 escape, so the token cannot collide with anything a
#                 row could legitimately mean. This buys BOTH readings
#                 of `|`: the CHARACTER (a `||` separator position) and
#                 the OPERATOR (alternation, e.g. `(do\x7cthen)`).
#
#                 The prohibition and the escape are not in tension:
#                 the file still contains no literal `|` outside the
#                 field separators. What changed is that "this format
#                 cannot express `|`" — which is what the missing
#                 positions were being blamed on — is no longer true.
#
#   id_regex      Extended regex matched against the FULL
#                 `tool_response.stdout` string. The first capture
#                 group is taken as the launch id. Leave empty when
#                 the launcher's stdout doesn't expose an id (e.g.
#                 `nohup foo &`); the hook synthesizes a stable id
#                 from `sha1(command)[0:12]` so dismissal still
#                 works. Same `|`-prohibition as command_regex.
#
#   desc          Free-form human-readable label. Stored verbatim
#                 on the wait entry so the watcher's emit can say
#                 something useful when surfacing
#                 `idle-orphan-async`. Variable interpolation is
#                 NOT supported.
#
# Hot path: this file is read once per Bash PostToolUse hook fire.
# Keep the pattern count small (≤ 20 lines) and the regexes cheap
# (no backtracking horrors). Currently 19 rows. Measured for
# your-org/nexus-code#1269, 5 fires per shape, against the 15-row
# predecessor: no latency separation at any of a short command, a 16 KB
# single-line non-matching command, or a 2000-token adversarial prefix
# line — the per-fire cost is dominated by the two process spawns
# (`jq`, `bash`), not by the row count or the prefix alternation.
#
# Adding a pattern is data-only: edit this file, commit, redeploy.
# No code change needed in the hook.

# POSITION, NOT MENTION (your-org/nexus-code#948).
#
# These rows match COMMAND TEXT, and prose about a launch is command
# text — so `grep "srun --no-block" log`, or a heredoc writing a PR
# description that names the pattern, used to register a wait. The
# population most likely to type such a command is the agent working
# on this detector, which is why it fired three times in one day on
# two different windows. A detector that fires on DOCUMENTATION of the
# thing it detects gets suppressed by whoever is under time pressure,
# which removes it entirely.
#
# The fix is to require a SYNTACTIC POSITION only a launch can occupy —
# start of command, or immediately after a `;` / `&` separator — rather
# than a bare mention anywhere in the string. Several rows per kind,
# one per position family, because each row must match a single
# contiguous shape; where two families differ only in a keyword the
# `\x7c` escape now expresses them as one alternation instead of two
# rows (see the header, and the parse assertion in
# test-async-launch-detect.sh).
#
# DECLARED BOUNDARY — stated as a RULE, not a list of examples.
#
# Command-position contexts split into two sets with DIFFERENT closure
# properties, and the boundary follows that split rather than any
# enumeration:
#
#   A. SHELL GRAMMAR — closed and completable. Start of line, after `;`
#      `&` `&&` `(`, after `{` FOLLOWED BY WHITESPACE, and the `do` /
#      `then` keyword rows GATED on a preceding separator. Finite,
#      enumerable from the POSIX grammar, and it can be FINISHED.
#      Extend this set by adding a separator.
#
#   B. COMMAND-TAKING WRAPPERS — open and NOT completable. Any utility
#      that takes a command as an argument joins this set, and new ones
#      appear.
#
#      B IS OPEN; THAT IS NOT A REASON TO COVER NONE OF IT
#      (your-org/nexus-code#1269). The set splits by HOW the wrapper
#      carries its command, and the two halves have different answers:
#
#      B1. TRANSPARENT PREFIX — the launcher appears as a BARE WORD in
#          command position after the wrapper's own option words:
#          `timeout 60 sbatch …`, `nice -n 10 sbatch …`,
#          `env FOO=1 sbatch …`, `eval sbatch …`, `! sbatch …`, and the
#          plain assignment prefix `FOO=1 sbatch …` (POSIX grammar, no
#          wrapper name involved at all). These are covered, by an
#          ALLOWLIST of wrapper names plus a prefix grammar that admits
#          only flags, bare numeric durations and assignments between
#          the wrapper and the launcher. The allowlist is explicitly NOT
#          a completion of B — a wrapper not named here is still missed,
#          and adding one is a data edit.
#
#          The prefix grammar is what keeps this from being a
#          re-unanchoring: `timeout 60 echo we do sbatch nightly` does
#          NOT match, because `echo` is not a flag, a number or an
#          assignment. Admitting arbitrary intervening WORDS would be
#          the #948 defect again.
#
#      B2. QUOTED COMMAND — the launcher is inside a string argument:
#          `bash -c "srun --no-block …"`, `sh -c '…'`,
#          `eval "srun --no-block …"`, `find -exec … {} \;`. These stay
#          UNDECIDABLE for the reason below: recovering them means
#          admitting `"` to the position class, which re-admits
#          `grep "srun --no-block"` in the same edit.
#
#      The line between B1 and B2 is not a judgement call — it is
#      whether the launcher is a bare word or inside quotes, which is
#      exactly what a command-text regex can and cannot see. Measured:
#      `eval srun --no-block ./j.sh` fires, `eval "srun --no-block
#      ./j.sh"` does not, from the same row.
#
# WHAT MAY NOT GO IN THE SEPARATOR CLASS, learned the expensive way.
# An earlier revision used [;&({!`)] — adding a BACKTICK, `)` and `!`.
# Markdown inline code is how every report, PR body, issue comment and
# commit message in this repo names a command, so `` `sbatch` `` is
# backtick-immediately-followed-by-sbatch and MATCHED. That revision
# fired on 11 of 13 realistic prose bodies — including its own PR
# description — i.e. it reproduced #948 at HIGHER frequency than the
# defect it fixed, because the original only ever reached the srun row.
# A character that commonly abuts a command name IN WRITING is not a
# separator. Same reason `{` and the keywords now require a real
# delimiter: `{sbatch}` and "we do sbatch runs nightly" are prose.
#
# Measured, two populations, driven through this hook with real newlines:
#
#   generator set (37 shapes, two independently generated case sets)
#     A shell-grammar launches caught : 12/18
#     B wrapper launches caught       :  1/9   (an ACCIDENT — `nohup
#         srun …&` matches the unchanged `nohup` row, not these; it is
#         not evidence that wrappers are covered)
#     P prose false positives         :  2/10
#
#   prose set (13 realistic GitHub-write bodies, backtick-bearing)
#     prose false positives           :  4/13   (was 11/13)
#     launches caught                 : 11/13
#
# RE-MEASURED for your-org/nexus-code#1269, on a 24-prose / 24-launch
# corpus driven through the unmodified hook with real newlines. The
# prose half deliberately includes MARKDOWN TABLES, because a `|`
# separator class would make a table cell a command position. Command
# and ref, so the numbers are checkable:
#
#     bash <corpus-driver> monitor/async-launch-patterns.conf
#     ref 703483b5 + this change, files UNSTAGED at measurement time
#
#                        before (blob d64b576b)   after
#     prose FP                 4/24                5/24
#     launches caught         10/24               20/24
#
# The single new prose FP is `echo 'either you sbatch it || srun
# --no-block it'` — a sentence carrying a literal `||`. It is the whole
# price of the `||` position, and it buys `false || srun …` and
# `test -f j.sh || sbatch job.sh`. Ten recovered launches for one prose
# sentence is the right side of this detector's cost model.
#
# The grammar shapes still missed have NAMED structural causes, not
# oversights — and one of these attributions was WRONG until #1269
# measured it:
#   `… | xargs … srun …` — was filed under "needs a literal `|`". It is
#       not: with `|` in the class the payload STILL misses, because the
#       word after the pipe is `xargs`, not the launcher. Its real
#       blocker is B1 (wrapper position), and `xargs` IS in the B1
#       allowlist now — so what remains blocking it is only the pipe.
#       Attribution matters: the pinned assertion named a cause that a
#       fix for that cause would not have removed.
#   `cat ids.txt | srun …`, `… | sbatch …` — a SINGLE `|` as a position
#       character. Expressible now (`\x7c`), and DECLINED by
#       measurement rather than by inexpressibility: `|` is a prose
#       character in this repo exactly as a backtick is. A markdown
#       table row `| srun --no-block | fire and forget |` fires, and
#       tables are how this workspace documents commands. That is the
#       same rule that removed the backtick — "a character that commonly
#       abuts a command name IN WRITING is not a separator" — applied
#       to `|`. `||` is not such a character and is admitted.
#   ``JOB=`sbatch job.sh` `` — backtick command substitution, given up
#       deliberately to keep backticks out of the class. `$( )` still
#       lands via `(`.
#
# UNDECIDABLE, not unfixed — declared here rather than chased:
#   `echo "if it is a batch job; then sbatch is the row that matches"`
#       contains a literal `; then sbatch` and is TEXTUALLY IDENTICAL
#       to a real `if …; then sbatch …`. No command-text regex can
#       separate them.
#   `bash -c "srun --no-block ./job.sh"` — the B2 half above. Recovering
#       it by adding `"` to the class re-admits `grep "srun --no-block"`
#       in the same edit; measured. Note the contrast that makes this a
#       real boundary rather than an excuse: the UNQUOTED sibling
#       `eval srun --no-block ./j.sh` IS caught, from the same row.
#   `echo 'call it (sbatch) for short'` — admitted by `(`. A further
#       tightening (require whitespace after `(` too) removes it and
#       costs `(sbatch job.sh)` without a space: measured at 3/13 prose
#       and 10/13 launches versus 4/13 and 11/13 here. Left as a
#       documented option rather than taken, because it trades a launch
#       shape and nobody has measured which is commoner.
#
# RATIOS HERE UNDERSTATE COVERAGE, because every case set used to
# produce them is SINGLE-LINE. Per-line matching also catches
# multi-line and structural launches that such a set cannot express at
# all — a launch in a multi-line `for` body, after a comment line,
# through a `\`-continuation, `(cd … && sbatch …)`, `$(sbatch …)`,
# tab-indented, or inside a heredoc. Independently measured: seven such
# shapes fire that no single-line set can test. Read the numbers below
# as a floor.
#
# SHAPE COUNT IS NOT FREQUENCY. Nobody has measured how often each
# shape occurs in real launches. Line-start, `&&`, `;` and `do` are
# plausibly the overwhelming majority, so these ratios must NOT be read
# as a fraction of launches. Honest statement: covers the commonest
# shapes, misses a long tail of unmeasured weight.
#
# KNOWN FALSE POSITIVES that remain, declared rather than hidden:
#   `echo a; srun --no-block is what the row matches` — fires on the
#       OLD unanchored row too. Residual, not introduced here.
#   `echo 'either you sbatch it || srun --no-block it'` — INTRODUCED by
#       the `||` position (your-org/nexus-code#1269). Same shape as the
#       `;` row's residual FP one line above, on a different separator.
#       Kept for the measured trade recorded above.
#   A HEREDOC WRITING DOCUMENTATION that contains a launch command at
#       the start of a line — CLOSED by your-org/nexus-code#1312, in the
#       HOOK rather than here. It was INTRODUCED by PER-LINE matching,
#       not by any pattern (attributed by holding this file constant and
#       varying the hook: whole-string MISS, per-line FIRE), and it is
#       fixed the same way: the hook now blanks the body of a heredoc
#       whose governing simple command is a named DATA CONSUMER (`cat`,
#       `tee`, `python3`, `jq`, …) and ONLY then. It is an ALLOWLIST with
#       a default of DO NOT MASK, so `bash <<EOF … sbatch … EOF`,
#       `ssh host <<EOF`, `cat <<EOF | bash` and every consumer the list
#       has never heard of keep firing exactly as before. The two
#       mitigations previously declined here — an indentation rule, and a
#       blanket heredoc skip — are still declined, and for the reason
#       recorded then: both trade a silent MISS for a quieter detector,
#       and the miss is this detector's expensive direction.
#       Two-sided measurement, a 20-prose / 24-launch corpus driven through
#       the real hook with real newlines, at ref 5bd6d400 + this change:
#       prose FP 9/20 -> 2/20, launch FN 0/24 -> 0/24. The FN column is the
#       one that had to be measured rather than assumed — a blanket skip
#       would have scored 5/24 there. The durable, re-runnable form of that
#       corpus is the `#1312 arm:` block in
#       test-async-launch-detect.sh, which asserts both directions.
#
#   `git commit -m '…; sbatch after a separator…'` — INTRODUCED by the
#       sbatch separator row. That row lacks srun's `[^&]*--no-block`
#       constraint, so `; sbatch <prose>` suffices. Kept because it
#       buys `cd /tmp && sbatch job.sh`, a real launch silently missed
#       before; a missed launch is worse than a false alarm, and the
#       consumer-side cost of a false wait is bounded (it changes the
#       operator's label, never the kill authorization).
#
# slurm sbatch — most common launch. Output line:
#   "Submitted batch job 52527284"
# Matches `sbatch`, `sbatch --array=1-10`, `sbatch --wrap='echo hi'`.
# Second row added with #948: the anchored row alone missed
# `cd /tmp && sbatch job.sh`, a live false NEGATIVE independent of #948.
# `sbatch --parsable` PRINTS A BARE ID, so the canonical `Submitted batch job
# <id>` regex matches NOTHING and the hook mints an unresolvable `syn-` token
# (your-org/nexus-code#1071 skeptic F2 — CONFIRMED, and observed live: a single
# `sbatch --parsable` produced `slurm:syn-0d1713a9e039` in a real worker
# heartbeat on the very branch that added the multi-id fix).
#
# THIS IS THE MECHANISM THAT ACTUALLY PRODUCED THE OBSERVED `slurm:syn-…`
# TOKENS. The per-call -> per-job fix is real and necessary, but it only ever
# concerned a grid whose stdout ALREADY carried canonical lines; on those, the
# old code yielded a real (first) id, never a `syn-`. So the two fixes address
# different paths and neither subsumes the other.
#
# NARROW ON PURPOSE, and the narrowness is the whole design. A general
# `^([0-9]+)$` id rule for every sbatch would register stray numeric stdout as a
# job id — and a WRONG id is strictly worse than a `syn-`, because `sacct` may
# resolve it to ANOTHER job's `COMPLETED` and tell the worker its data is good.
# That is the failure this issue exists to prevent, manufactured by its own fix.
# Gating on `--parsable` in the COMMAND means the bare-id reading applies only
# where the launcher is documented to emit exactly that.
#
# `--parsable` may append `;<cluster>`, so the capture is leading digits rather
# than a whole-line anchor; a literal `|` cannot appear in these fields (it is
# the separator), which rules out the `(;$)` alternation spelling.
# Placed ABOVE the generic sbatch rows because matching is first-match-wins on
# the COMMAND: a plain `sbatch` misses these and falls through unchanged.
# READING THESE ROWS. Two sub-expressions repeat; `\x7c` is a literal `|`
# (see the header). Decoded, they are:
#
#   POSITION-AFTER-SEPARATOR   ([;&(]+|[|][|])[[:space:]]*
#       `;` `&` `&&` `(` and — new with your-org/nexus-code#1269 — `||`.
#       A SINGLE `|` is deliberately absent: it is a prose character in this
#       repo (markdown tables), by the same rule that excluded the backtick.
#
#   TRANSPARENT-PREFIX (B1)    ((timeout|nice|env|stdbuf|time|nohup|xargs|eval)[[:space:]]+
#                              |![[:space:]]+
#                              |-[^[:space:]]+[[:space:]]+
#                              |[0-9]+[smhd]?[[:space:]]+
#                              |[A-Za-z_][A-Za-z0-9_]*=[^[:space:]]*[[:space:]]+)+
#       A wrapper name, a `!`, a flag, a bare numeric duration, or a shell
#       assignment — repeated, then the launcher. The list of admitted token
#       SHAPES is the load-bearing part, not the wrapper names: admitting an
#       arbitrary intervening WORD would re-unanchor the row and reproduce
#       #948. `timeout 60 echo we do sbatch nightly` does not match.
#
# The prefix group appears in SIX rows and must stay byte-identical across
# them; test-async-launch-detect.sh asserts that, because six hand-maintained
# copies of one regex is exactly the shape that drifts silently.
#
slurm|^[[:space:]]*sbatch\b[^;&]*--parsable\b|^([0-9_]+)|sbatch --parsable
slurm|([;&(]+\x7c[\x7c][\x7c])[[:space:]]*sbatch\b[^;&]*--parsable\b|^([0-9_]+)|sbatch --parsable
slurm|[;&][[:space:]]*(do\x7cthen)[[:space:]]+sbatch\b[^;&]*--parsable\b|^([0-9_]+)|sbatch --parsable
slurm|\{[[:space:]]+sbatch\b[^;&]*--parsable\b|^([0-9_]+)|sbatch --parsable
slurm|^[[:space:]]*((timeout\x7cnice\x7cenv\x7cstdbuf\x7ctime\x7cnohup\x7cxargs\x7ceval)[[:space:]]+\x7c![[:space:]]+\x7c-[^[:space:]]+[[:space:]]+\x7c[0-9]+[smhd]?[[:space:]]+\x7c[A-Za-z_][A-Za-z0-9_]*=[^[:space:]]*[[:space:]]+)+sbatch\b[^;&]*--parsable\b|^([0-9_]+)|sbatch --parsable
slurm|([;&(]+\x7c[\x7c][\x7c])[[:space:]]*((timeout\x7cnice\x7cenv\x7cstdbuf\x7ctime\x7cnohup\x7cxargs\x7ceval)[[:space:]]+\x7c![[:space:]]+\x7c-[^[:space:]]+[[:space:]]+\x7c[0-9]+[smhd]?[[:space:]]+\x7c[A-Za-z_][A-Za-z0-9_]*=[^[:space:]]*[[:space:]]+)+sbatch\b[^;&]*--parsable\b|^([0-9_]+)|sbatch --parsable

slurm|^[[:space:]]*sbatch\b|Submitted batch job ([0-9_]+)|sbatch
slurm|([;&(]+\x7c[\x7c][\x7c])[[:space:]]*sbatch\b|Submitted batch job ([0-9_]+)|sbatch
slurm|\{[[:space:]]+sbatch\b|Submitted batch job ([0-9_]+)|sbatch
slurm|[;&][[:space:]]*(do\x7cthen)[[:space:]]+sbatch\b|Submitted batch job ([0-9_]+)|sbatch
slurm|^[[:space:]]*((timeout\x7cnice\x7cenv\x7cstdbuf\x7ctime\x7cnohup\x7cxargs\x7ceval)[[:space:]]+\x7c![[:space:]]+\x7c-[^[:space:]]+[[:space:]]+\x7c[0-9]+[smhd]?[[:space:]]+\x7c[A-Za-z_][A-Za-z0-9_]*=[^[:space:]]*[[:space:]]+)+sbatch\b|Submitted batch job ([0-9_]+)|sbatch
slurm|([;&(]+\x7c[\x7c][\x7c])[[:space:]]*((timeout\x7cnice\x7cenv\x7cstdbuf\x7ctime\x7cnohup\x7cxargs\x7ceval)[[:space:]]+\x7c![[:space:]]+\x7c-[^[:space:]]+[[:space:]]+\x7c[0-9]+[smhd]?[[:space:]]+\x7c[A-Za-z_][A-Za-z0-9_]*=[^[:space:]]*[[:space:]]+)+sbatch\b|Submitted batch job ([0-9_]+)|sbatch

slurm-srun-async|^[[:space:]]*srun\b[^&]*--no-block\b|Submitted job ([0-9_]+)|srun --no-block
slurm-srun-async|([;&(]+\x7c[\x7c][\x7c])[[:space:]]*srun\b[^&]*--no-block\b|Submitted job ([0-9_]+)|srun --no-block
slurm-srun-async|\{[[:space:]]+srun\b[^&]*--no-block\b|Submitted job ([0-9_]+)|srun --no-block
slurm-srun-async|[;&][[:space:]]*(do\x7cthen)[[:space:]]+srun\b[^&]*--no-block\b|Submitted job ([0-9_]+)|srun --no-block
slurm-srun-async|^[[:space:]]*((timeout\x7cnice\x7cenv\x7cstdbuf\x7ctime\x7cnohup\x7cxargs\x7ceval)[[:space:]]+\x7c![[:space:]]+\x7c-[^[:space:]]+[[:space:]]+\x7c[0-9]+[smhd]?[[:space:]]+\x7c[A-Za-z_][A-Za-z0-9_]*=[^[:space:]]*[[:space:]]+)+srun\b[^&]*--no-block\b|Submitted job ([0-9_]+)|srun --no-block
slurm-srun-async|([;&(]+\x7c[\x7c][\x7c])[[:space:]]*((timeout\x7cnice\x7cenv\x7cstdbuf\x7ctime\x7cnohup\x7cxargs\x7ceval)[[:space:]]+\x7c![[:space:]]+\x7c-[^[:space:]]+[[:space:]]+\x7c[0-9]+[smhd]?[[:space:]]+\x7c[A-Za-z_][A-Za-z0-9_]*=[^[:space:]]*[[:space:]]+)+srun\b[^&]*--no-block\b|Submitted job ([0-9_]+)|srun --no-block

# ORDERING NOTE (your-org/nexus-code#1269): `nohup` is in the B1 wrapper
# allowlist above, and the launcher rows come FIRST, so `nohup sbatch j.sh &`
# now records `slurm` with the REAL job id rather than this row's synthetic
# token. That is the #1071 failure mode shrinking: a `syn-` id is unresolvable
# by construction, a job id is not. A nohup wrapping anything these rows do not
# know still lands here, unchanged.
#
# `nohup ... &` — backgrounded subprocess. No job id in stdout;
# synthetic id keyed on the command. Anchor on the trailing `&`
# (with optional whitespace) so `nohup echo foo` without backgrounding
# doesn't match — that's a foreground call.
nohup|\bnohup\b.*&[[:space:]]*$||nohup background
